<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海獭主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --bg-elevated: #12121a;
            --bg-card: rgba(18, 18, 26, 0.6);
            --text-primary: #f5f5f7;
            --text-secondary: rgba(245, 245, 247, 0.6);
            --text-muted: rgba(245, 245, 247, 0.35);
            --accent: #e8e4e1;
            --accent-hover: #ffffff;
            --border: rgba(245, 245, 247, 0.08);
            --border-hover: rgba(245, 245, 247, 0.2);
            --danger: #ff6b6b;
            --danger-hover: #ff8585;
            --success: #4ade80;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Space Grotesk', 'Noto Sans SC', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        .glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .glow-1 {
            background: radial-gradient(circle, #4a5568 0%, transparent 70%);
            top: -200px;
            right: -200px;
        }

        .glow-2 {
            background: radial-gradient(circle, #2d3748 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 80px;
        }

        /* 状态栏 */
        .status-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 100;
        }

        .status-badge {
            padding: 8px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .status-badge.syncing {
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.3);
        }

        .status-badge.error {
            color: var(--danger);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .settings-btn {
            padding: 8px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .clock-section { text-align: center; }

        .time {
            font-size: clamp(5rem, 12vw, 10rem);
            font-weight: 300;
            letter-spacing: -0.03em;
            line-height: 1;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .date {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 16px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .search-section { width: 100%; max-width: 640px; }

        .search-wrapper { position: relative; }

        .search-input {
            width: 100%;
            padding: 20px 28px;
            padding-left: 56px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 400;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
        }

        .search-input::placeholder { color: var(--text-muted); }
        .search-input:hover { border-color: var(--border-hover); }

        .search-input:focus {
            border-color: var(--accent);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 4px rgba(232, 228, 225, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .search-wrapper:focus-within .search-icon { color: var(--accent); }

        .search-engines {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
        }

        .engine-btn {
            padding: 8px 16px;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 500;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.05em;
        }

        .engine-btn:hover {
            color: var(--text-secondary);
            background: rgba(245, 245, 247, 0.05);
        }

        .engine-btn.active {
            color: var(--text-primary);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
        }

        .shortcuts-section { width: 100%; }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
        }

        .shortcut-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: grab;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            text-decoration: none;
            position: relative;
            user-select: none;
        }

        .shortcut-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            background: var(--bg-elevated);
            box-shadow: var(--shadow-hover);
        }

        .shortcut-card:active { cursor: grabbing; }
        .shortcut-card.dragging { opacity: 0.5; transform: scale(0.95); border-color: var(--accent); }
        .shortcut-card.drag-over { border-color: var(--accent); background: rgba(232, 228, 225, 0.1); }

        .shortcut-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            transition: transform 0.3s ease;
            pointer-events: none;
        }

        .shortcut-card:hover .shortcut-icon { transform: scale(1.1); }

        .shortcut-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .shortcut-card:hover .shortcut-name { color: var(--text-primary); }

        .add-card {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            background: transparent;
            border: 2px dashed var(--border);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-card:hover {
            border-color: var(--border-hover);
            background: rgba(245, 245, 247, 0.02);
        }

        .add-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .add-card:hover .add-icon {
            color: var(--text-secondary);
            transform: scale(1.1);
        }

        .add-text { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }

        /* 右键菜单 */
        .context-menu {
            position: fixed;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 0;
            min-width: 140px;
            box-shadow: var(--shadow-hover);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.95);
            transition: all 0.15s ease;
        }

        .context-menu.active { opacity: 1; visibility: visible; transform: scale(1); }

        .context-menu-item {
            padding: 10px 16px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .context-menu-item:hover { background: rgba(245, 245, 247, 0.05); color: var(--text-primary); }
        .context-menu-item.delete { color: var(--danger); }
        .context-menu-item.delete:hover { background: rgba(255, 107, 107, 0.1); }
        .context-menu-divider { height: 1px; background: var(--border); margin: 6px 0; }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 24px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal { transform: scale(1); }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .modal-input {
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 16px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
        }

        .modal-input:focus { border-color: var(--accent); }
        .modal-input::placeholder { color: var(--text-muted); }

        .modal-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .modal-hint a {
            color: var(--accent);
            text-decoration: none;
        }

        .modal-hint a:hover { text-decoration: underline; }

        .modal-actions { display: flex; gap: 12px; margin-top: 8px; }

        .modal-btn {
            flex: 1;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-family: inherit;
            font-weight: 500;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .modal-btn.cancel {
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border);
        }

        .modal-btn.cancel:hover { border-color: var(--border-hover); color: var(--text-primary); }

        .modal-btn.confirm {
            color: var(--bg);
            background: var(--accent);
        }

        .modal-btn.confirm:hover { background: var(--accent-hover); }

        .modal-btn.danger {
            color: #fff;
            background: var(--danger);
        }

        .modal-btn.danger:hover { background: var(--danger-hover); }

        .footer {
            position: fixed;
            bottom: 40px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }

        @media (max-width: 768px) {
            body { padding: 40px 24px; }
            .container { gap: 60px; }
            .status-bar { top: 12px; right: 12px; flex-direction: column; gap: 6px; }
            .status-badge, .settings-btn { font-size: 0.7rem; padding: 6px 10px; }
            .shortcuts-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
            .shortcut-card, .add-card { padding: 16px; border-radius: 16px; }
            .shortcut-icon, .add-icon { width: 40px; height: 40px; font-size: 1.5rem; }
            .shortcut-name, .add-text { font-size: 0.75rem; }
            .modal { margin: 20px; padding: 24px; }
        }

        @media (max-width: 480px) {
            .shortcuts-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-badge" id="statusBadge">本地模式</div>
        <button class="settings-btn" id="settingsBtn">⚙ 设置</button>
    </div>

    <div class="container">
        <section class="clock-section">
            <div class="time" id="clock">00:00</div>
            <div class="date" id="date">加载中...</div>
        </section>

        <section class="search-section">
            <div class="search-wrapper">
                <span class="search-icon">⌘</span>
                <input type="text" class="search-input" placeholder="搜索..." id="search-input">
            </div>
            <div class="search-engines">
                <button class="engine-btn active" data-engine="google">Google</button>
                <button class="engine-btn" data-engine="baidu">百度</button>
                <button class="engine-btn" data-engine="bing">Bing</button>
            </div>
        </section>

        <section class="shortcuts-section">
            <div class="shortcuts-grid" id="shortcutsGrid"></div>
        </section>
    </div>

    <div class="footer">
        <span>海獭主页 · Sea Otter</span>
    </div>

    <!-- 右键菜单 -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" id="menuEdit"><span>✎</span> 编辑</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item delete" id="menuDelete"><span>🗑</span> 删除</div>
    </div>

    <!-- 快捷方式模态框 -->
    <div class="modal-overlay" id="shortcutModal">
        <div class="modal">
            <div class="modal-title" id="shortcutModalTitle">添加快捷方式</div>
            <input type="text" class="modal-input" id="siteName" placeholder="网站名称">
            <input type="text" class="modal-input" id="siteUrl" placeholder="网址 (例如: https://example.com)">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="shortcutCancelBtn">取消</button>
                <button class="modal-btn confirm" id="shortcutConfirmBtn">添加</button>
            </div>
        </div>
    </div>

    <!-- GitHub 设置模态框 -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-title">GitHub 云同步设置</div>
            <input type="text" class="modal-input" id="githubToken" placeholder="GitHub Token" style="font-family: monospace;">
            <input type="text" class="modal-input" id="gistId" placeholder="Gist ID（可选，留空自动创建）">
            <div class="modal-hint">
                <strong>如何获取 Token：</strong><br>
                1. 进入 <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings</a><br>
                2. Generate new token (classic)<br>
                3. 勾选 <code>gist</code> 权限<br>
                4. 生成并复制 Token
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="settingsCancelBtn">取消</button>
                <button class="modal-btn danger" id="settingsLogoutBtn">退出登录</button>
                <button class="modal-btn confirm" id="settingsSaveBtn">保存</button>
            </div>
        </div>
    </div>

            link: '<svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>'

        // 变量
        let shortcuts = [];
        let draggedItem = null;
        let draggedIndex = null;
        let contextMenuTarget = null;
        let editingIndex = null;
        let githubToken = localStorage.getItem('otter_github_token');
        let gistId = localStorage.getItem('otter_gist_id');
        let isSyncing = false;

        // DOM
        const grid = document.getElementById('shortcutsGrid');
        const contextMenu = document.getElementById('contextMenu');
        const statusBadge = document.getElementById('statusBadge');
        const shortcutModal = document.getElementById('shortcutModal');
        const settingsModal = document.getElementById('settingsModal');

        // GitHub API
        const GIST_FILENAME = 'sea-otter-shortcuts.json';

        async function gistRequest(method, path, body = null) {
            const response = await fetch(`https://api.github.com${path}`, {
                method,
                headers: {
                    'Authorization': `Bearer ${githubToken}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: body ? JSON.stringify(body) : null
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'GitHub API error');
            }
            
            return response.json();
        }

        async function loadFromGist() {
            if (!githubToken) return null;
            
            try {
                // 尝试获取现有 Gist
                if (gistId) {
                    const gist = await gistRequest('GET', `/gists/${gistId}`);
                    const file = gist.files[GIST_FILENAME];
                    if (file && file.content) {
                        return JSON.parse(file.content);
                    }
                } else {
                    // 查找用户的 sea-otter gists
                    const gists = await gistRequest('GET', '/gists?per_page=100');
                    const existing = gists.find(g => 
                        g.description === 'sea-otter-homepage-data' && 
                        g.files[GIST_FILENAME]
                    );
                    if (existing) {
                        gistId = existing.id;
                        localStorage.setItem('otter_gist_id', gistId);
                        return JSON.parse(existing.files[GIST_FILENAME].content);
                    }
                }
            } catch (error) {
                console.error('加载 Gist 失败:', error);
                updateStatus('error', '同步失败');
            }
            
            return null;
        }

        async function saveToGist(data) {
            if (!githubToken || isSyncing) return false;
            
            isSyncing = true;
            updateStatus('syncing', '同步中...');
            
            try {
                const content = JSON.stringify(data, null, 2);
                
                if (gistId) {
                    // 更新现有 Gist
                    await gistRequest('PATCH', `/gists/${gistId}`, {
                        files: {
                            [GIST_FILENAME]: { content }
                        }
                    });
                } else {
                    // 创建新 Gist
                    const gist = await gistRequest('POST', '/gists', {
                        description: 'sea-otter-homepage-data',
                        public: false,
                        files: {
                            [GIST_FILENAME]: { content }
                        }
                    });
                    gistId = gist.id;
                    localStorage.setItem('otter_gist_id', gistId);
                }
                
                updateStatus('connected', '已同步');
                return true;
            } catch (error) {
                console.error('保存 Gist 失败:', error);
                updateStatus('error', '同步失败');
                return false;
            } finally {
                isSyncing = false;
            }
        }

        function updateStatus(type, text) {
            statusBadge.className = 'status-badge ' + type;
            statusBadge.textContent = text;
        }

        async function syncShortcuts() {
            // 优先加载云端数据
            const cloudData = await loadFromGist();
            
            if (cloudData && Array.isArray(cloudData)) {
                shortcuts = cloudData;
                localStorage.setItem('otterShortcuts', JSON.stringify(shortcuts));
            } else {
                // 加载本地数据
                const localData = localStorage.getItem('otterShortcuts');
                shortcuts = localData ? JSON.parse(localData) : defaultShortcuts;
            }
            
            renderShortcuts();
        }

        function saveShortcuts() {
            localStorage.setItem('otterShortcuts', JSON.stringify(shortcuts));
            if (githubToken) {
                saveToGist(shortcuts);
            }
        }

        function renderShortcuts() {
            grid.innerHTML = '';

            shortcuts.forEach((shortcut, index) => {
                const card = document.createElement('div');
                card.className = 'shortcut-card';
                card.draggable = true;
                card.dataset.index = index;
                
                const iconSvg = icons[shortcut.icon] || icons.link;
                
                card.innerHTML = `
                    <div class="shortcut-icon" style="color: ${shortcut.color || '#fff'}">
                        ${iconSvg}
                    </div>
                    <span class="shortcut-name">${shortcut.name}</span>
                `;

                card.addEventListener('click', (e) => {
                    if (!card.classList.contains('dragging')) {
                        window.open(shortcut.url, '_blank');
                    }
                });

                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragend', handleDragEnd);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e, index);
                });

                // 触摸支持
                let touchStartTime = 0;
                let touchStartX = 0;
                let touchStartY = 0;
                let isLongPress = false;

                card.addEventListener('touchstart', (e) => {
                    touchStartTime = Date.now();
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isLongPress = false;

                    setTimeout(() => {
                        if (Date.now() - touchStartTime >= 500) {
                            isLongPress = true;
                            showContextMenu({ clientX: touchStartX, clientY: touchStartY }, index);
                        }
                    }, 500);
                }, { passive: true });

                card.addEventListener('touchmove', (e) => {
                    if (Date.now() - touchStartTime < 500) {
                        touchStartTime = 0;
                    }
                }, { passive: true });

                grid.appendChild(card);
            });

            // 新增卡片
            const addCard = document.createElement('div');
            addCard.className = 'add-card';
            addCard.innerHTML = `
                <div class="add-icon">+</div>
                <span class="add-text">新增</span>
            `;
            addCard.addEventListener('click', () => openShortcutModal());
            grid.appendChild(addCard);
        }

        // 拖拽处理
        function handleDragStart(e) {
            draggedItem = this;
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.shortcut-card').forEach(card => {
                card.classList.remove('drag-over');
            });
            draggedItem = null;
            draggedIndex = null;
        }

        function handleDragOver(e) { e.preventDefault(); }
        function handleDragEnter(e) { e.preventDefault(); if (this !== draggedItem) this.classList.add('drag-over'); }
        function handleDragLeave(e) { this.classList.remove('drag-over'); }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            const dropIndex = parseInt(this.dataset.index);
            if (draggedIndex !== null && draggedIndex !== dropIndex) {
                const item = shortcuts[draggedIndex];
                shortcuts.splice(draggedIndex, 1);
                shortcuts.splice(dropIndex, 0, item);
                saveShortcuts();
                renderShortcuts();
            }
        }

        // 右键菜单
        function showContextMenu(e, index) {
            contextMenuTarget = index;
            contextMenu.style.left = e.clientX + 'px';
            contextMenu.style.top = e.clientY + 'px';
            contextMenu.classList.add('active');
        }

        function hideContextMenu() {
            contextMenu.classList.remove('active');
            contextMenuTarget = null;
        }

        document.addEventListener('click', hideContextMenu);
        document.addEventListener('scroll', hideContextMenu);

        document.getElementById('menuEdit').addEventListener('click', () => {
            if (contextMenuTarget !== null) openShortcutModal(contextMenuTarget);
            hideContextMenu();
        });

        document.getElementById('menuDelete').addEventListener('click', () => {
            if (contextMenuTarget !== null) {
                shortcuts.splice(contextMenuTarget, 1);
                saveShortcuts();
                renderShortcuts();
            }
            hideContextMenu();
        });

        // 快捷方式模态框
        function openShortcutModal(index = null) {
            editingIndex = index;
            document.getElementById('shortcutModalTitle').textContent = index !== null ? '编辑快捷方式' : '添加快捷方式';
            document.getElementById('shortcutConfirmBtn').textContent = index !== null ? '保存' : '添加';
            
            if (index !== null) {
                document.getElementById('siteName').value = shortcuts[index].name;
                document.getElementById('siteUrl').value = shortcuts[index].url;
            } else {
                document.getElementById('siteName').value = '';
                document.getElementById('siteUrl').value = '';
            }
            
            shortcutModal.classList.add('active');
            document.getElementById('siteName').focus();
        }

        function closeShortcutModal() {
            shortcutModal.classList.remove('active');
            editingIndex = null;
        }

        document.getElementById('shortcutCancelBtn').addEventListener('click', closeShortcutModal);
        shortcutModal.addEventListener('click', (e) => { if (e.target === shortcutModal) closeShortcutModal(); });
        
        document.getElementById('shortcutConfirmBtn').addEventListener('click', () => {
            const name = document.getElementById('siteName').value.trim();
            let url = document.getElementById('siteUrl').value.trim();
            if (!name || !url) return;
            if (!url.startsWith('http')) url = 'https://' + url;

            let icon = 'link', color = '#fff';
            const domain = url.toLowerCase();
            if (domain.includes('github')) { icon = 'github'; color = '#fff'; }
            else if (domain.includes('bilibili')) { icon = 'bilibili'; color = '#fb7299'; }
            else if (domain.includes('zhihu')) { icon = 'zhihu'; color = '#0084ff'; }
            else if (domain.includes('youtube')) { icon = 'youtube'; color = '#ff0000'; }
            else if (domain.includes('twitter') || domain.includes('x.com')) { icon = 'twitter'; color = '#1da1f2'; }
            else if (domain.includes('notion')) { icon = 'notion'; color = '#fff'; }
            else if (domain.includes('figma')) { icon = 'figma'; color = '#f24e1e'; }
            else if (domain.includes('vercel')) { icon = 'vercel'; color = '#fff'; }

            if (editingIndex !== null) {
                shortcuts[editingIndex] = { name, url, icon, color };
            } else {
                shortcuts.push({ name, url, icon, color });
            }
            
            saveShortcuts();
            renderShortcuts();
            closeShortcutModal();
        });

        document.getElementById('siteUrl').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('shortcutConfirmBtn').click();
        });

        // 设置模态框
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('githubToken').value = githubToken || '';
            document.getElementById('gistId').value = gistId || '';
            settingsModal.classList.add('active');
        });

        function closeSettingsModal() {
            settingsModal.classList.remove('active');
        }

        document.getElementById('settingsCancelBtn').addEventListener('click', closeSettingsModal);
        settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettingsModal(); });

        document.getElementById('settingsSaveBtn').addEventListener('click', async () => {
            const token = document.getElementById('githubToken').value.trim();
            const gId = document.getElementById('gistId').value.trim();
            
            if (token) {
                githubToken = token;
                localStorage.setItem('otter_github_token', githubToken);
            }
            
            if (gId) {
                gistId = gId;
                localStorage.setItem('otter_gist_id', gistId);
            }
            
            // 测试连接
            if (token) {
                updateStatus('syncing', '测试连接...');
                try {
                    await gistRequest('GET', '/gists?per_page=1');
                    updateStatus('connected', '已同步');
                    // 立即同步
                    await syncShortcuts();
                } catch (error) {
                    updateStatus('error', '连接失败');
                }
            } else {
                githubToken = null;
                gistId = null;
                localStorage.removeItem('otter_github_token');
                localStorage.removeItem('otter_gist_id');
                updateStatus('', '本地模式');
            }
            
            closeSettingsModal();
        });

        document.getElementById('settingsLogoutBtn').addEventListener('click', () => {
            githubToken = null;
            gistId = null;
            localStorage.removeItem('otter_github_token');
            localStorage.removeItem('otter_gist_id');
            document.getElementById('githubToken').value = '';
            document.getElementById('gistId').value = '';
            updateStatus('', '本地模式');
        });

        // 时钟
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            document.getElementById('date').textContent = `${year}年${month}月${date}日 · ${weekDays[now.getDay()]}`;
        }

        // 搜索
        const searchEngines = { google: 'https://www.google.com/search?q=', baidu: 'https://www.baidu.com/s?wd=', bing: 'https://www.bing.com/search?q=' };
        let currentEngine = localStorage.getItem('otter_engine') || 'google';

        document.querySelectorAll('.engine-btn').forEach(btn => {
            if (btn.dataset.engine === currentEngine) btn.classList.add('active');
            btn.addEventListener('click', function() {
                document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentEngine = this.dataset.engine;
                localStorage.setItem('otter_engine', currentEngine);
            });
        });

        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim()) {
                window.open(searchEngines[currentEngine] + encodeURIComponent(this.value.trim()), '_blank');
            }
        });

        // 初始化
        async function init() {
            if (githubToken) {
                updateStatus('syncing', '加载中...');
            }
            await syncShortcuts();
            updateClock();
            setInterval(updateClock, 1000);
        }

        init();
    </script>
